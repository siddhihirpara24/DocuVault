{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block body %}
<div class="auth-wrapper">
    <div class="card auth-card text-center p-4">
        <div class="card-body">
            <div class="text-danger mb-3">
                <i class="bi bi-gear-wide-connected display-1"></i>
            </div>
            <h1 class="display-5 fw-bold text-danger">500</h1>
            <h3 class="mb-3">Internal Server Error</h3>
            <p class="text-muted mb-4">
                An unexpected condition was encountered. The administrator has been notified.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('user.dashboard') }}" class="btn btn-primary">
                    <i class="bi bi-house-door-fill me-1"></i> Go to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
