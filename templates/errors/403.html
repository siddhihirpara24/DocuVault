{% extends "base.html" %}

{% block title %}403 - Access Denied{% endblock %}

{% block body %}
<div class="auth-wrapper">
    <div class="card auth-card text-center p-4">
        <div class="card-body">
            <div class="text-danger mb-3">
                <i class="bi bi-shield-lock-fill display-1"></i>
            </div>
            <h1 class="display-5 fw-bold text-danger">403</h1>
            <h3 class="mb-3">Access Forbidden</h3>
            <p class="text-muted mb-4">
                You do not have permission to view or manage this document or page.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('user.dashboard') }}" class="btn btn-primary">
                    <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
                </a>
                <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-secondary">
                    <i class="bi bi-box-arrow-right me-1"></i> Log Out
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
