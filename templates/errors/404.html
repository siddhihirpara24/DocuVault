{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block body %}
<div class="auth-wrapper">
    <div class="card auth-card text-center p-4">
        <div class="card-body">
            <div class="text-warning mb-3">
                <i class="bi bi-question-circle-fill display-1"></i>
            </div>
            <h1 class="display-5 fw-bold text-warning">404</h1>
            <h3 class="mb-3">Page Not Found</h3>
            <p class="text-muted mb-4">
                The resource or document you were looking for could not be found or may have been moved.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('user.dashboard') }}" class="btn btn-primary">
                    <i class="bi bi-arrow-left me-1"></i> Back to Safety
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
