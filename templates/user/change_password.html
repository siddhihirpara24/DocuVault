{% extends "user/base_user.html" %}

{% block title %}Change Password{% endblock %}
{% block page_heading %}Security Settings{% endblock %}

{% block content %}
<div class="container-fluid px-0" style="max-width: 650px;">
    <!-- Navigation Back -->
    <div class="mb-4">
        <a href="{{ url_for('user.profile') }}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Back to Profile
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3 border-bottom">
            <h5 class="fw-bold mb-0 text-primary">
                <i class="bi bi-shield-lock-fill me-2"></i>Change Account Password
            </h5>
            <p class="text-muted small mb-0">Ensure your new password contains at least 6 characters.</p>
        </div>

        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('user.change_password') }}">
                <!-- Current Password -->
                <div class="mb-3">
                    <label for="current_password" class="form-label fw-semibold">Current Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-key text-muted"></i></span>
                        <input type="password" class="form-control" id="current_password" name="current_password" required autofocus>
                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="current_password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- New Password -->
                <div class="mb-3">
                    <label for="new_password" class="form-label fw-semibold">New Password (Min. 6 characters) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control" id="new_password" name="new_password" minlength="6" required>
                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="new_password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm New Password -->
                <div class="mb-4">
                    <label for="confirm_new_password" class="form-label fw-semibold">Confirm New Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-shield-check text-muted"></i></span>
                        <input type="password" class="form-control" id="confirm_new_password" name="confirm_new_password" required>
                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="confirm_new_password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-check2-circle me-1"></i> Update Password
                    </button>
                    <a href="{{ url_for('user.profile') }}" class="btn btn-light px-4">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
